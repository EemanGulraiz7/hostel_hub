<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audit Log | HostelHub</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="audit" data-requires-role="ADMIN">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main>
    <div class="page-header">
      <div>
        <h1>Audit log</h1>
        <span class="muted">ADMIN only. Rows written by <code>pr_allocate_bed</code>, <code>trg_payment_audit</code>, <code>pr_vacate_bed</code> and the login API.</span>
      </div>
    </div>
    <div id="messages"></div>
    <div class="card">
      <form id="filterForm" class="filters">
        <div class="field"><label for="action">Action</label><select id="action" name="action"><option value="">All actions</option></select></div>
        <button class="btn" type="submit">Filter</button>
      </form>
      <div class="table-wrap"><table>
        <thead><tr><th>#</th><th>Time</th><th>User</th><th>Action</th><th>Table</th><th>Record</th><th>client_request_id</th><th>Details</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
      <div class="pager" id="pager"></div>
    </div>
  </main>
</div>
<script src="/js/app.js"></script>
<script src="/js/audit.js"></script>
</body>
</html>
