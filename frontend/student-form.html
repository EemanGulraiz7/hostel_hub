<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student | HostelHub</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="students">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main>
    <div class="page-header">
      <h1 id="formTitle">Add student</h1>
      <a class="btn btn-secondary" href="/students.html">Back to list</a>
    </div>
    <div id="messages"></div>

    <div class="card">
      <!-- novalidate: we show our own messages; the server validates again -->
      <form id="studentForm" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="roll_no">Roll number *</label>
            <input id="roll_no" name="roll_no" inputmode="numeric" maxlength="6" placeholder="e.g. 231031">
            <span class="field-error"></span>
          </div>
          <div class="field">
            <label for="full_name">Full name *</label>
            <input id="full_name" name="full_name" maxlength="80">
            <span class="field-error"></span>
          </div>
          <div class="field">
            <label for="gender">Gender *</label>
            <select id="gender" name="gender">
              <option value="">Choose...</option><option value="M">Male</option><option value="F">Female</option>
            </select>
            <span class="field-error"></span>
          </div>
          <div class="field">
            <label for="email">Email *</label>
            <input id="email" name="email" type="email" maxlength="100" placeholder="name@student.edu.pk">
            <span class="field-error"></span>
          </div>
          <div class="field">
            <label for="phone">Phone</label>
            <input id="phone" name="phone" maxlength="20" placeholder="0300-1234567">
            <span class="field-error"></span>
          </div>
          <div class="field">
            <label for="program">Program *</label>
            <select id="program" name="program">
              <option value="">Choose...</option>
              <option>BSIT</option><option>BSCS</option><option>BSSE</option><option>BSAI</option><option>BBA</option>
            </select>
            <span class="field-error"></span>
          </div>
          <div class="field">
            <label for="semester">Semester *</label>
            <select id="semester" name="semester">
              <option value="">Choose...</option>
              <option>1</option><option>2</option><option>3</option><option>4</option>
              <option>5</option><option>6</option><option>7</option><option>8</option>
            </select>
            <span class="field-error"></span>
          </div>
          <div class="field" id="bedInfo"></div>
        </div>
        <div class="form-actions">
          <button class="btn" type="submit" id="saveBtn">Save student</button>
          <a class="btn btn-secondary" href="/students.html">Cancel</a>
        </div>
      </form>
    </div>
  </main>
</div>
<script src="/js/app.js"></script>
<script src="/js/student-form.js"></script>
</body>
</html>
