<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | HostelHub</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="login-page">
  <div class="card login-card">
    <h1>HostelHub</h1>
    <p class="muted">Hostel Room Allocation &amp; Mess Billing. Staff log in.</p>

    <div id="messages"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required maxlength="30">
        <span class="field-error"></span>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <span class="field-error"></span>
      </div>
      <button class="btn" type="submit" id="loginBtn">Log in</button>
    </form>

    <p class="muted small" style="margin-top:16px">
      Demo accounts: <code>admin / Admin@123</code> (ADMIN),
      <code>warden.ali / Warden@123</code> (WARDEN)
    </p>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
